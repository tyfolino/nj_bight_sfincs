      MSL(1992)->NAVD88 from NOAA VDatum's 2019 separation grids sampled offline
      (data/NACCS/vdatum_grids). Built 2026-08-26 by scripts/build_naccs_boundary.py
      on the v3 mesh (mask==2 line identical between the probe and the freeze).

