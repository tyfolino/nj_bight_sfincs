bed_v3_coarse_25m:
  data_type: RasterDataset
  uri: elevation_v3/bed_v3_coarse_25m.tif
  driver:
    name: rasterio
    options: {}
  metadata:
    category: topography
    crs: 32618
    unit: m+NAVD88
    source: >-
      The v3 tiers (V3_ELEVATION_LIST order, minus the NoData-only northern carving tiers)
      warped to 25 m / EPSG:32618 with -r average and stacked, with 50/100/200 m overviews.
      🔴 FOR QUADTREE REFINEMENT GATING ONLY, never the bed: hydromt's refine_in_polygon
      merges EVERY tier onto the polygon's bbox grid at each level (merge_multi_dataarrays),
      and on v3's 130 x 200 km bbox at 25 m that is 11 tiers x 42 M cells — the first probe
      reached 164 GB RSS in two minutes and was killed (2026-08-24). The subgrid samples the
      native tiers, chunked, and is unaffected. Built by scripts/build_v3_coarse_bed.sh
      (base tiers bilinear, carving tiers MIN so 5 m channels survive a 25 m cell).

cudem_nj_v3:
  data_type: RasterDataset
  uri: elevation_v3/cudem_nj_v3.vrt
  driver:
    name: rasterio
    options: {}
  metadata:
    category: topography
    unit: m+NAVD88
    source: >-
      The archived cudem_nj.vrt (NOAA 1/9" CUDEM, lat 38.75-41.5) re-declared as a LOCAL VRT
      over the same archive tiles, so that external overviews (cudem_nj_v3.vrt.ovr, 2..64x,
      average) can be built beside it — the archive is read-only. Same data. Overviews are
      what let hydromt's `zoom=(res, "meter")` read the subgrid's coarse levels at ~25 m
      instead of native 3 m over the whole v3 bbox (docs/STATUS.md, 2026-08-24).


naccs_sandy_v3_stockdon03:
