    options: {}
  metadata:
    category: landuse
    source: NLCD Annual Land Cover 2012 (USGS/MRLC)
    url: https://www.mrlc.gov/data

# Same product, v4 extent. The archived nlcd_2012 clip above is NoData on ~530 km2 of
# Delaware land inside v4 (west bank, Lewes / Cape Henlopen). This is a windowed read of
# the MRLC Annual NLCD C1V1 COG on its native 30 m Albers grid (same CRS, same pixel
