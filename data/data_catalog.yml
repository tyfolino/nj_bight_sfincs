  uri: gtsm/naccs_sandy_v4.nc
  driver:
    name: geodataset_xarray
    options: {}
  metadata:
    category: ocean
    crs: 4326
    unit: m+NAVD88
    source: NACCS/CHS ADCIRC SimB1HT storm 001 (Sandy), 241 save points on the drawn
      water-level line (delaware_mouth 35, ocean 159, lower_bay_entrance 18,
      rockaway_inlet 20, narrows 14, kvk_east 12, cd_canal 1; support sha16
      4f020321d32076d7), MSL(1992)->NAVD88 from NOAA VDatum's 2019 separation grids
      sampled offline (Sandy Hook anchor -0.004 m). Built 2026-09-28 by
      scripts/build_naccs_boundary.py on the frozen v4 mesh (mask==2 identical to the
      09-27 trial build).

# `ehydro_delaware_v4.tif` stays keyless: it was a CHECK that CUDEM is right Philadelphia →
# Trenton (median −0.09 m), not a tier.
# Curve numbers for v4 (infiltration ON, user 2026-09-28). Open water / NoData = CN 100
# (rain on water stays in the water) — unlike cn_nj / cn_v3, which carry the shipped
# table's water CN 0. Built on nlcd_2012_v4 (Domain.landcover).
ksat_v4_refreeze:
  data_type: RasterDataset
  uri: infiltration_v4_refreeze/ksat_v4_refreeze.tif
  driver:
    name: rasterio
    options: {}
  metadata:
    category: soil
    crs: 4326
    unit: micrometer s-1
    source: >-
