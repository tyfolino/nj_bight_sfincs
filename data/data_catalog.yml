      unit's dominant component with a hydgrp (the same component cn_v4 takes its HSG from),
      rasterized on the NLCD 2012 v4 grid (2026-10-15, scripts/build_cn_nj.py --ksat). The
      cnb recovery rate (nj_sfincs/infiltration.py). NoData = no ksat (water, urban).

