#   waves_v4/cora_waves_v4.nc — scripts/build_cora_waves.py, 2026-09-29, 19,406 nodes x 121 h;
#   identical to cora_waves_v3.nc on all 11,594 shared nodes. Read via Domain.cora_waves.
